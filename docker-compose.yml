services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: incident_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/init-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d incident_assistant"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/incident_assistant
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      WEB_ORIGIN: http://localhost:8080
      LLM_PROVIDER: mock
      SEED_DEMO: "true"
      ALLOW_SEED_DEMO: "true"
      SEED_PASSWORD: local-demo-password
      COOKIE_SECURE: "false"
      TRUST_PROXY: "true"
      PORT: "3000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:
