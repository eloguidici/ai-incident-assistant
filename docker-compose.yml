services:
  pii:
    # The hash-locked CPU wheel targets x86_64; ARM hosts need Docker emulation.
    platform: linux/amd64
    build:
      context: ./services/pii
    environment:
      PII_HMAC_KEY_FILE: /run/secrets/pii_hmac_key
      PII_PERSON_ENABLED: ${PII_PERSON_ENABLED:-true}
      PII_TORCH_THREADS: ${PII_TORCH_THREADS:-1}
      PII_SLOT_WAIT_SECONDS: ${PII_SLOT_WAIT_SECONDS:-20}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    secrets:
      - pii_hmac_key
    read_only: true
    tmpfs:
      - /tmp:size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 4g
    cpus: ${PII_CPUS:-1}
    networks: [pii_internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 120s

  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: incident_assistant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/docker/init-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d incident_assistant"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    networks: [default, pii_internal]
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    environment:
      DATABASE_URL: postgres://app:app@postgres:5432/incident_assistant
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (see .env.example)}
      WEB_ORIGIN: http://localhost:8080
      LLM_PROVIDER: mock
      PII_ENABLED: ${PII_ENABLED:-true}
      PII_PERSON_ENABLED: ${PII_PERSON_ENABLED:-true}
      PII_SERVICE_URL: http://pii:8000
      PII_TIMEOUT_MS: ${PII_TIMEOUT_MS:-10000}
      SOURCE_TEXT_MAX: ${SOURCE_TEXT_MAX:-1000}
      QUESTION_MAX: ${QUESTION_MAX:-500}
      SEED_DEMO: "true"
      ALLOW_SEED_DEMO: "true"
      # Compose escapes $$ to preserve the literal dollar in this synthetic password.
      SEED_PASSWORD: "Demo1234$$"
      COOKIE_SECURE: "false"
      TRUST_PROXY: "true"
      PORT: "3000"
    depends_on:
      pii:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api

volumes:
  pgdata:

secrets:
  pii_hmac_key:
    file: ${PII_HMAC_KEY_PATH:-./.local/pii-hmac.key}

networks:
  pii_internal:
    internal: true
