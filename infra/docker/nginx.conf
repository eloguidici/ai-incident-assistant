server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  # API structured logs use route templates; avoid duplicate raw URL/query logs here.
  access_log off;
  error_log /dev/null;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; style-src 'self'; script-src 'self'; base-uri 'self'; frame-ancestors 'none'" always;

  location /api/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout ${API_PROXY_READ_TIMEOUT};
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}

